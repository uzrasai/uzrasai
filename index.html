<style>
:root{--bg:#f6f5f2;--panel:#fff;--text:#1d1d1f;--muted:#6b6b70;--line:#e6e4e0;--accent:#16857f;--accent-text:#fff;--danger:#c0392b;--sel:#e4f1f0;--tline:#c9c6bf;--nav:#f7f7f6;--navsel:#e9e9e7;--midsel:#eaf1f4}
@media (prefers-color-scheme: dark){:root{--bg:#161618;--panel:#1f1f22;--text:#ececee;--muted:#9a9aa2;--line:#2e2e33;--accent:#3fb3aa;--accent-text:#fff;--danger:#e0675a;--sel:#1e3533;--tline:#45454c;--nav:#1a1a1c;--navsel:#2b2b30;--midsel:#262d33}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:40px}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
a.btnlink{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font:inherit;border:1px solid var(--accent);border-radius:10px;padding:8px 12px;min-height:40px;box-sizing:border-box;background:var(--accent);color:var(--accent-text)}
button.icon{border:none;padding:8px 10px;min-width:42px;font-size:17px}
#list li.grp .gedit .ico,#editGroupBtn .ico{width:16px;height:16px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#list li.grp .gadd .ico{stroke-width:2.4}
#editGroupBtn .ico{width:18px;height:18px}
.menuwrap{position:relative;display:inline-flex;flex:none}
#gearMenu{position:absolute;top:calc(100% + 6px);right:0;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px;min-width:180px;display:flex;flex-direction:column}
#gearMenu.hidden{display:none}
#insMenu{position:absolute;top:calc(100% + 6px);left:0;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px;min-width:170px;display:flex;flex-direction:column}
#insMenu.hidden{display:none}
#insMenu button{border:none;text-align:left;border-radius:8px;padding:9px 12px;min-height:40px;display:flex;align-items:center;gap:10px;white-space:nowrap}
#insMenu button:hover{background:var(--sel)}
#insMenu .ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* Kortelės forma */
#cardDlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:12px;z-index:60}
#cardDlg.hidden{display:none}
#cardDlg .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;width:100%;max-width:460px;max-height:94vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
#cardDlg h3{margin:0;font-size:18px}
#cardDlg label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
#cardDlg small{font-size:11px}
#cardDlg input,#cardDlg select,#cardDlg textarea{font:inherit;font-size:15px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
#cardDlg textarea{resize:vertical;min-height:110px;line-height:1.4}
#cardDlg .cdtools{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
#cardDlg .cdtools button{flex:none;width:30px;height:30px;min-height:0;padding:0;border-radius:7px;font-weight:800;font-size:15px;background:#fff;border:1px solid var(--line)}
#cardDlg .cdtools button.bgs{border-color:rgba(0,0,0,.15)}
#cardDlg .cdtools button:hover{outline:2px solid var(--accent);outline-offset:1px}
#cardDlg .cdtools .sep{width:1px;height:22px;background:var(--line);margin:0 3px}
#cardDlg .cdtools .brk{flex-basis:100%;height:0}   /* antra eilutė: fono spalvos ir ✕ */
#cardDlg .cdrich{min-height:120px;max-height:260px;overflow:auto;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#1d1d1f;font-size:15px;line-height:1.45;outline:none;overflow-wrap:anywhere}
#cardDlg .cdrich:focus{border-color:var(--accent)}
#cardDlg label.cdchk{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--text);cursor:pointer}
#cardDlg label.cdchk input{width:18px;height:18px;padding:0;flex:none;accent-color:var(--accent)}
#cardDlg .cdc.off{opacity:.35;pointer-events:none}
#editor .ncard.notl{max-width:416px}   /* toks pat plotis kaip kortelės su linija */
#cardDlg .cdc{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}
#cardDlg .box>*{flex:none}   /* Firefox: neleidžiam formos eilutėms susispausti – geriau slinkti */
#cardDlg .csw{display:flex;flex-wrap:wrap;gap:6px;min-height:36px;flex:none}
#cardDlg .csw button{flex:none;width:32px;height:32px;min-height:0;min-width:32px;padding:0;border-radius:50%;border:2px solid rgba(0,0,0,.15);font-size:11px;color:#555;line-height:1}
#cardDlg .csw button.auto{width:auto;padding:0 10px;border-radius:16px;background:var(--bg);color:var(--text);font-size:12px}
#cardDlg .csw button.on{outline:3px solid var(--accent);outline-offset:2px}
#cardDlg .cd2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#cardDlg .tpbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--bg);font-size:15px;padding:8px 10px}
#cardDlg .tpbtn .arr{margin-left:auto;color:var(--muted)}
#cardDlg .tpbtn svg,#cardDlg .tpgrid svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#cardDlg .tpgrid{border:1px solid var(--line);border-radius:10px;padding:6px 8px 8px;max-height:300px;overflow:auto;background:var(--bg)}
#cardDlg .tpgrid .tpg{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:8px 2px 4px}
#cardDlg .tpgrid .tpr{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:4px}
#cardDlg .tpgrid button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:0;padding:6px 2px;border:1px solid transparent;border-radius:8px;background:none;color:var(--text);font-size:11px;line-height:1.15;text-align:center}
#cardDlg .tpgrid button:hover{background:var(--panel);border-color:var(--line)}
#cardDlg .tpgrid button.on{border-color:var(--accent);background:var(--panel)}
#cardDlg .cdTI{display:grid;grid-template-columns:1fr 96px;gap:10px}
#cardDlg .cdBtns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
#cardDlg .cdBtns .left{margin-right:auto}
/* Kortelė užraše (su laiko juosta dešinėje) */
#editor .ncard{display:flex;align-items:stretch;max-width:540px;margin:0;color:#1d1d1f;user-select:text}
#editor .ncard .nc-body{flex:1;min-width:0;margin:6px 0 12px;padding:12px 14px;border-radius:12px;background:#dcfce7;box-shadow:0 10px 24px -6px rgba(0,0,0,.28),0 3px 8px -2px rgba(0,0,0,.14),0 0 1px rgba(0,0,0,.12);line-height:1.45}
#editor .ncard .nc-tl{flex:none;width:44px;position:relative}
#editor .ncard .nc-tl::before{content:"";position:absolute;left:30px;top:0;bottom:0;width:2px;background:#c9c6bf}
#editor .ncard .nc-tl::after{content:"";position:absolute;left:0;top:44px;width:24px;height:2px;background:#c9c6bf}
#editor .ncard .nc-dot{position:absolute;left:20px;top:34px;width:22px;height:22px;border-radius:50%;background:#e03131;box-shadow:0 4px 10px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.3),inset 0 -3px 4px rgba(0,0,0,.25),inset 0 2px 3px rgba(255,255,255,.35);z-index:1}
#editor .ncard .nc-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
#editor .ncard .nc-title{font-weight:700;font-size:18px;color:#2353c9;overflow-wrap:anywhere}
#editor .ncard .nc-ico{font-size:18px;display:inline-flex;color:#6b6b70;padding:2px}
#editor .ncard .nc-ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#editor .ncard .nc-grip{flex:none;cursor:grab;touch-action:none;user-select:none;color:#6b6b70;opacity:.6;font-size:18px;letter-spacing:-3px;padding:2px 6px 2px 0;margin-left:-4px}
#editor .ncard .nc-grip:hover{opacity:1}
#editor .ncard.dragging{opacity:.45}
body.cardDrag,body.cardDrag *{cursor:grabbing!important;user-select:none!important}
#cardDropLine{position:fixed;height:3px;background:var(--accent);border-radius:2px;pointer-events:none;z-index:70;display:none;box-shadow:0 0 0 1px rgba(255,255,255,.6)}
#editor .ncard .nc-idx{flex:none;font-weight:700;font-size:18px;color:#2353c9;white-space:nowrap;margin-left:-2px}
#editor .ncard .nc-btn{display:inline-flex;cursor:pointer;color:#6b6b70;padding:2px;border-radius:6px}
#editor .ncard .nc-btn:hover{color:#1d1d1f;background:rgba(0,0,0,.06)}
#editor .ncard .nc-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#editor .ncard .nc-row{display:flex;align-items:center;gap:6px;font-size:15px}
#editor .ncard .nc-row svg{width:15px;height:15px;flex:none;fill:none;stroke:#6b6b70;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#editor .ncard .nc-row.loc svg{stroke:#6b6b70}
#editor .ncard .nc-row a{color:#2353c9;overflow-wrap:anywhere}
#editor .ncard .nc-price{color:#6b6b70;min-height:22px}
#editor .ncard .nc-price b{color:#1d1d1f}
#editor .ncard .nc-desc{margin-top:6px;font-size:15px;overflow-wrap:anywhere}
#editor .ncard .nc-body{position:relative}
#editor .ncard .nc-price.pm{display:none}
/* 1 eilutė: ⋮⋮ tipo ikona ......... ✎ ⧉ 🗑 ; 2 eilutė: pavadinimas + indeksas; toliau laukai, datos langelis dešinėje */
#editor .ncard .nc-main{display:flow-root;padding-top:34px}
#editor .ncard .nc-tools{display:flex;align-items:center;gap:10px;position:absolute;top:9px;left:14px;right:14px}
#editor .ncard .nc-tools .nc-edit{margin-left:auto}
#editor .ncard .nc-head{flex-wrap:wrap;column-gap:6px;row-gap:0}
#editor .ncard .nc-title{min-width:0}
#editor .ncard .nc-idx.empty{display:none}
#editor .ncard .nc-cal{float:right;display:flex;flex-direction:column;align-items:center;justify-content:center;box-sizing:border-box;width:96px;height:88px;overflow:hidden;padding:4px 4px;margin:-2px -4px 6px 12px;background:#d6e6fb;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.10);color:#1d1d1f;line-height:1.05;text-align:center;user-select:none}
#editor .ncard .nc-cal b{font-size:30px;font-weight:600}
#editor .ncard .nc-cal .ws{display:none}.nc-cal.we{background:#fdecef;color:#1d1d1f}.nc-cal.we .w{color:#1d1d1f}
#editor .ncard .nc-cal.we{background:#fdecef;color:#1d1d1f}
#editor .ncard .nc-cal.we .w{color:#1d1d1f}
#editor .ncard .nc-cal .m{white-space:nowrap;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:3px}
#editor .ncard .nc-cal .c{display:none}
#editor .ncard .nc-cal .y{display:block;margin-top:2px}
#editor .ncard .nc-cal .w{font-size:12px;font-style:italic;font-family:Georgia,'Times New Roman',serif;margin-top:3px;color:#1d1d1f}
#editor .ncard .nc-imgs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#editor .ncard .nc-imgs img{display:block;height:96px;width:auto;max-width:100%;object-fit:cover;margin:0;border-radius:8px;cursor:zoom-in;box-shadow:0 1px 3px rgba(0,0,0,.2)}
#cardDlg .cdph{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
#cardDlg .cdph .th{position:relative;flex:none}
#cardDlg .cdph .th img{display:block;height:72px;width:auto;max-width:140px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
#cardDlg .cdph .th button{position:absolute;top:-7px;right:-7px;width:24px;height:24px;min-height:0;padding:0;border-radius:50%;background:var(--danger);border-color:var(--danger);color:#fff;font-size:13px;line-height:1}
#cardDlg .cdphBar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#cardDlg .cdphBar select{width:auto;padding:6px 8px;font-size:14px}
#cardDlg .cdpaste{flex:1;min-width:150px;border:2px dashed var(--line);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--muted);text-align:center;outline:none;cursor:text}
#cardDlg .cdpaste:focus{border-color:var(--accent);color:var(--text)}
#imgView{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:10px;cursor:zoom-out}
#imgView.hidden{display:none}
#imgView img{max-width:100%;max-height:100%;border-radius:6px;background:#fff}
#editor .ncard.t-flight .nc-body{background:#dbeafe}
#editor .ncard.t-transport .nc-body{background:#fef9c3}
#editor .ncard.t-food .nc-body{background:#ffedd5}
#editor .ncard.t-activity .nc-body{background:#ede9fe}
#editor .ncard.t-other .nc-body{background:#f1f5f9}
#colorMenu{position:absolute;top:calc(100% + 6px);left:0;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:10px 10px 2px;width:max-content}
#colorMenu.hidden{display:none}
#colorMenu .cl{font-size:12px;color:var(--muted);margin:0 2px 6px}
#colorMenu .sw{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
#colorMenu .sw button{width:32px;height:32px;min-height:0;padding:0;border-radius:8px;border:1px solid var(--line);font-weight:800;font-size:17px;background:var(--panel)}
#colorMenu .sw button[data-k="bg"]{border-color:rgba(0,0,0,.12)}
#colorMenu .sw button.sw0{background:var(--bg);color:var(--muted);font-size:14px;font-weight:400}
#colorMenu .sw button:hover{outline:2px solid var(--accent);outline-offset:1px}
@media (prefers-color-scheme: dark){#editor span[style*="background-color"]{color:#1d1d1f}}
#gearMenu button{border:none;text-align:left;border-radius:8px;padding:10px 12px;min-height:40px;white-space:nowrap}
#gearMenu button:hover{background:var(--sel)}
#foldBtn .ico{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button.icon .ico{width:20px;height:20px;display:block;margin:0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button:disabled{opacity:.4;cursor:default}
input{font:inherit;color:inherit}
.hidden{display:none!important}
.pwmask{-webkit-text-security:disc;text-security:disc}   /* slaptažodis rodomas taškais, bet naršyklė nesiūlo jo išsaugoti */
#lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);z-index:50}
#lock #lockForm{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
#lock h1{margin:0;font-size:22px}
#lock p{margin:0;color:var(--muted);font-size:14px}
#lock input,#lock .secret{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
.secret{min-height:1.5em;line-height:1.5;white-space:nowrap;overflow:hidden;cursor:text;outline:none;letter-spacing:.12em;color:var(--text)}
.secret:focus{border-color:var(--accent)!important;box-shadow:0 0 0 1px var(--accent)}
.secret.empty::before{content:attr(data-ph);color:var(--muted);letter-spacing:normal}
#dlgSec{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
#lockErr{color:var(--danger);font-size:14px;min-height:1.2em}
.ver{font-size:12px;color:var(--muted);text-align:center}
.linkbtn{border:none;background:none;color:var(--accent);font-size:14px;min-height:32px;padding:4px 8px;cursor:pointer}
#app{display:flex;height:100%}
#side{width:300px;flex:none;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
#sideTop{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
#search{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
#list{flex:1;overflow:auto;margin:0;padding:6px;list-style:none}
#list li{padding:10px 12px;border-radius:10px;cursor:pointer}
#list li.active{background:var(--sel)}
#list li .t{font-weight:600;white-space:normal;overflow-wrap:anywhere;line-height:1.3}
#list li .d{font-size:12px;color:var(--muted)}
#sideBottom{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
#dlg .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
#dlg h3{margin:0;font-size:18px}
#dlg p{margin:0;color:var(--muted);font-size:14px;white-space:pre-line}
#dlgIn{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
#dlgSelLbl{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
#dlgSel{font:inherit;font-size:15px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;max-width:100%;min-width:0}
#list li.grp .grip{cursor:grab;touch-action:none;user-select:none;color:var(--muted);opacity:.55;font-size:14px;letter-spacing:-3px;padding:4px 6px 4px 0;margin-left:-4px}
#list li.grp .grip:hover{opacity:1}
#list li.grp.dragging{opacity:.45}
body.gdragging,body.gdragging *{cursor:grabbing!important;user-select:none!important}
#dropLine{position:fixed;height:3px;border-radius:2px;background:var(--accent);z-index:70;pointer-events:none;display:none}
#dropLine.bad{background:var(--danger)}
#list li.grp.subg{text-transform:none;letter-spacing:0;font-size:14px}
#dlgBtns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#dlgBtns .left{margin-right:auto}
#dlgBtns.rows{flex-direction:column;align-items:stretch}
#dlgBtns .brow{display:flex;flex-wrap:wrap;gap:8px}

function makeSecret(el,ph,label){

 d.id=el.id;d.className=(el.className?el.className+' ':'')+'secret';

 function render(){d.textContent=val.replace(/[\s\S]/g,'•');d.classList.toggle('empty',!val);caretEnd();}
 function allSel(){var s=getSelection();return val&&s.rangeCount&&!s.isCollapsed&&d.contains(s.anchorNode)&&s.toString().length>=val.length;}
 Object.defineProperty(d,'value',{get:function(){return val;},set:function(v){val=String(v==null?'':v);render();}});
 d.select=function(){var r=document.createRange();r.selectNodeContents(d);var s=getSelection();s.removeAllRanges();s.addRange(r);};

  var t=e.inputType;
  if(t==='insertCompositionText')return;            // klaviatūros kompozicija (pvz., ą per „negyvą“ klavišą) – baigiama compositionend
  e.preventDefault();
  if(t==='insertText'||t==='insertReplacementText'){var x=e.data||'';if(allSel())val='';val+=x;}
  else if(t==='insertFromPaste'||t==='insertFromDrop'){var y=(e.dataTransfer&&e.dataTransfer.getData('text/plain'))||'';if(allSel())val='';val+=y.replace(/[\r\n]/g,'');}
  else if(/^delete/.test(t)){if(allSel()||/Word|Line/.test(t))val='';else if(/Backward/.test(t))val=val.slice(0,-1);}
  render();
 });

 d.addEventListener('paste',function(e){e.preventDefault();var y=(e.clipboardData&&e.clipboardData.getData('text/plain'))||'';if(allSel())val='';val+=y.replace(/[\r\n]/g,'');render();});
 ['copy','cut','drop','dragstart'].forEach(function(n){d.addEventListener(n,function(e){e.preventDefault();});});

}

   if(st.dk){dk=await needDevKey(st.dk);if(!dk)throw new Error('Be įrenginio rakto atrakinti negalima.');}

function getGroup(id){if(!id)return null;for(var i=0;i<data.groups.length;i++)if(data.groups[i].id===id)return data.groups[i];return null;}
function groupName(id){var g=getGroup(id);return g?g.name:'';}
function noteGroupId(n){return (n.group&&getGroup(n.group))?n.group:null;}
// Hierarchija: g.parent – tėvinės grupės id (nebūtinas)
function parentOf(id){var g=getGroup(id);return (g&&g.parent&&g.parent!==id&&getGroup(g.parent))?g.parent:null;}
function ancestors(id){var out=[],seen={},p=parentOf(id);while(p&&!seen[p]){seen[p]=1;out.push(p);p=parentOf(p);}return out;}
function isUnder(id,anc){return id===anc||ancestors(id).indexOf(anc)>=0;}
function groupPath(id){var a=ancestors(id).reverse().map(groupName);a.push(groupName(id));return a.join(' / ');}
function byName(a,b){return a.name.localeCompare(b.name,'lt');}
// Grupių tvarka: g.order (rankinė). Be order – pagal abėcėlę (ensureOrder priskiria)
function byOrder(a,b){var ao=typeof a.order==='number'?a.order:1e9,bo=typeof b.order==='number'?b.order:1e9;return ao-bo||byName(a,b);}
function childrenOf(pid){return data.groups.filter(function(g){return parentOf(g.id)===(pid||null);}).sort(byOrder);}
function ensureOrder(){
 var parents={};data.groups.forEach(function(g){parents[parentOf(g.id)||'']=1;});
 Object.keys(parents).forEach(function(p){
  var sib=childrenOf(p||null),max=-1;
  sib.forEach(function(g){if(typeof g.order==='number')max=Math.max(max,g.order);});
  sib.forEach(function(g){if(typeof g.order!=='number')g.order=++max;});
 });
}
function nextOrder(pid){var m=-1;childrenOf(pid).forEach(function(g){if(typeof g.order==='number')m=Math.max(m,g.order);});return m+1;}
// Perkelia grupę „dragId“ prieš/po grupės „targetId“ (tame pačiame lygyje kaip target). targetId=null – lygio pabaiga (pagrindinis)
function placeGroup(dragId,targetId,after){
 var g=getGroup(dragId);if(!g)return 'nėra';
 var par=targetId?parentOf(targetId):null;
 if(targetId===dragId)return 'same';
 if(par&&isUnder(par,dragId))return 'Grupės negalima perkelti į jos pačios pogrupį.';
 if((parentOf(dragId)||null)!==(par||null)&&nameTaken(g.name,dragId,par))
  return (par?'Grupėje „'+groupPath(par)+'“ ':'Tarp pagrindinių grupių ')+'jau yra „'+g.name+'“.';
 var sib=childrenOf(par).filter(function(x){return x.id!==dragId;});
 var i=targetId?sib.map(function(x){return x.id;}).indexOf(targetId):sib.length;
 if(i<0)i=sib.length;else if(after&&targetId)i++;
 sib.splice(i,0,g);
 if(par)g.parent=par;else delete g.parent;
 sib.forEach(function(x,k){x.order=k;});

}
function groupTree(){var out=[];(function rec(pid,d){childrenOf(pid).forEach(function(g){out.push({g:g,depth:d});rec(g.id,d+1);});})(null,0);return out;}

  var seen={},p=g.parent;
  while(p){if(p===g.id||seen[p]){delete g.parent;break;}seen[p]=1;var pg=getGroup(p);p=pg&&pg.parent;}
 });
}

 if(!dup){g.order=nextOrder(par);if(par)g.parent=par;else delete g.parent;return;}

// Grąžina {groups:[{id,name}], notes:[{id,title,html,updated,group}]} arba null (atšaukta)
async function parseImport(text){
 var t=text.replace(/^﻿/,'').trim();
 // 1) JSON eksportas
 if(t.charAt(0)==='{'){
  var j;try{j=JSON.parse(t);}catch(_){throw new Error('Netinkamas JSON failas.');}
  if(!j||!Array.isArray(j.notes))throw new Error('Šiame JSON faile nėra užrašų.');
  return normalizeImport(j);
 }
 // 2) Užrašų HTML failas (užšifruotas)
 var m=t.match(/<script id="store" type="application\/json">([\s\S]*?)<\/script>/);
 if(!m)throw new Error('Tai nėra užrašų failas (nerastas duomenų blokas).');
 var raw2=m[1].trim();
 if(!raw2)throw new Error('Šiame faile dar nėra išsaugotų užrašų.');
 var st;try{st=JSON.parse(raw2);}catch(_){throw new Error('Pažeistas duomenų blokas.');}
 var s=unb64(st.salt),it=st.iter||ITER,iv=unb64(st.iv),ct=unb64(st.ct),pt=null;

 if(st.salt===b64(salt)&&it===keyIter){try{pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);}catch(_){pt=null;}}
 var msg='Įveskite to failo slaptažodį.';
 while(!pt){
  var r=await dialog({title:'Failo slaptažodis',text:msg,input:'',inputType:'password',buttons:[{l:'Atšaukti',v:null},{l:'Atrakinti',v:'ok',c:'primary'}]});
  if(!r)return null;
  var idk=null;if(st.dk){idk=await needDevKey(st.dk);if(!idk)return null;}
  try{var k=await deriveKey(r.value,s,it,idk);pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},k,ct);}
  catch(_){msg='Neteisingas slaptažodis. Bandykite dar kartą.';}
 }
 return normalizeImport(JSON.parse(dec.decode(pt)));
}

var DROP_TAGS=/^(SCRIPT|STYLE|TEMPLATE|IFRAME|FRAME|FRAMESET|OBJECT|EMBED|APPLET|NOSCRIPT|TITLE|META|LINK|BASE|FORM|INPUT|BUTTON|TEXTAREA|SELECT|OPTION|SVG|MATH|AUDIO|VIDEO|SOURCE|TRACK|CANVAS|PORTAL|DIALOG)$/;

 function walk(from,to){
  Array.prototype.forEach.call(from.childNodes,function(n){
   if(n.nodeType===3){to.appendChild(document.createTextNode(n.nodeValue));return;}
   if(n.nodeType!==1)return;
   var t=n.tagName.toUpperCase();
   if(n.classList&&n.classList.contains('ncard')){   // kortelė – perpiešiam iš jos duomenų (viskas išvaloma cardHTML)
    var cd=cardData(n);['type','title','idx','date','price','loc','desc','bg','dot'].forEach(function(k){if(cd[k]!=null&&typeof cd[k]!=='string')cd[k]=String(cd[k]);});
    if(cd.dh)cd.dh=cleanDesc(String(cd.dh));
    var tmp=document.createElement('div');tmp.innerHTML=cardHTML(cd);if(tmp.firstChild)to.appendChild(tmp.firstChild);return;
   }
   if(DROP_TAGS.test(t))return;
   if(!SAFE_TAGS.test(t)){walk(n,to);return;}   // nežinoma žymė – paliekam tik turinį
   if(t==='IMG'){var src=n.getAttribute('src')||'';if(!/^data:image\/(png|jpe?g|gif|webp);base64,[A-Za-z0-9+\/=\s]+$/i.test(src))return;}
   var el=document.createElement(t.toLowerCase());
   if(t==='IMG')el.setAttribute('src',n.getAttribute('src').replace(/\s/g,''));
   if(t==='A'){var h=(n.getAttribute('href')||'').trim();if(/^(https?:|mailto:|tel:)/i.test(h)){el.setAttribute('href',h);el.setAttribute('target','_blank');el.setAttribute('rel','noopener noreferrer');}}
   if(t==='TD'||t==='TH'){['colspan','rowspan'].forEach(function(a){var v=parseInt(n.getAttribute(a),10);if(v>1&&v<50)el.setAttribute(a,String(v));});}
   var mw=n.getAttribute('data-mw');if(mw&&/^\d{1,4}(\.\d+)?$/.test(mw))el.setAttribute('data-mw',mw);
   if(t==='FONT'){var fc=n.getAttribute('color')||'';if(/^#?[0-9a-z]{3,20}$/i.test(fc))el.setAttribute('color',fc);}
   if(n.style){var st=[];STYLE_OK.forEach(function(pn){var v=n.style.getPropertyValue(pn);if(v&&!/url\(|expression|javascript|@import|\\/i.test(v))st.push(pn+':'+v);});if(st.length)el.setAttribute('style',st.join(';'));}

}

  var up=typeof n.updated==='number'?n.updated:Date.parse(n.updated);
  var g=n.group?String(n.group):null;
  // JSON eksporte gali būti tik grupės pavadinimas
  if(!g&&n.groupName){
   var f=groups.filter(function(x){return x.name===n.groupName;})[0];
   if(!f){f={id:newId(),name:String(n.groupName)};groups.push(f);}
   g=f.id;

}

// Koordinatės: visada 7 skaičiai po kablelio, be tarpo: 27.2567961,-9.7808637 (adresas paliekamas kaip yra)
function fmtCoords(v){
 v=(v||'').trim();
 var ll=parseCoords(v);
 return ll?ll[0].toFixed(7)+','+ll[1].toFixed(7):v;
}
// Atpažįsta: 27.2567961,-9.7808637 | 54.68 25.27 | N 028° 8.866, W 15° 25.799 | 28°8.866'N 15°25.799'W | N 28° 8' 52.0" W 15° 25' 47.9"
function parseCoords(v){
 var ok=function(a,b){return !isNaN(a)&&!isNaN(b)&&Math.abs(a)<=90&&Math.abs(b)<=180?[a,b]:null;};
 var m=/^(-?\d{1,3}(?:\.\d+)?)\s*[,;\s]\s*(-?\d{1,3}(?:\.\d+)?)$/.exec(v);
 if(m)return ok(parseFloat(m[1]),parseFloat(m[2]));
 var u=v.toUpperCase().replace(/,(?=\d)/g,'.');   // 8,866 -> 8.866
 if(!/[°'′"″NSEW]/.test(u)||/[A-DF-MO-RT-VX-Z]/.test(u))return null;   // ne koordinatės (pvz., adresas)
 var t=u.match(/[NSEW]|-?\d+(?:\.\d+)?/g);if(!t)return null;
 var groups=[],g=null,letters=t.filter(function(x){return /[NSEW]/.test(x);}).length;
 if(letters){
  var prefix=/[NSEW]/.test(t[0]);
  t.forEach(function(x){
   var L=/[NSEW]/.test(x);
   if(prefix){if(L){g={h:x,n:[]};groups.push(g);}else if(g)g.n.push(parseFloat(x));}
   else{if(!g){g={h:'',n:[]};groups.push(g);}if(L){g.h=x;g=null;}else g.n.push(parseFloat(x));}
  });
 }else{
  u.split(/[;,]/).forEach(function(part){var n=part.match(/-?\d+(?:\.\d+)?/g);if(n)groups.push({h:/^\s*-/.test(part)?'-':'',n:n.map(parseFloat)});});
 }
 if(groups.length!==2)return null;
 var val=function(gr){if(!gr.n.length||gr.n.length>3)return NaN;var d=Math.abs(gr.n[0])+(gr.n[1]||0)/60+(gr.n[2]||0)/3600;
  return (gr.h==='S'||gr.h==='W'||gr.h==='-'||gr.n[0]<0)?-d:d;};
 var a=groups[0],b=groups[1];
 if(a.h==='E'||a.h==='W'||b.h==='N'||b.h==='S'){var x=a;a=b;b=x;}   // jei pirma ilguma – sukeičiam
 return ok(val(a),val(b));
}

// Aprašymo HTML valymas: leidžiami tik paryškinimai, eilutės ir spalvos (tekstas / fonas)
function cleanDesc(html){
 var src=new DOMParser().parseFromString('<div>'+(html||'')+'</div>','text/html').body.firstChild,out=document.createElement('div');
 var okc=function(v){v=(v||'').trim();return /^(#[0-9a-f]{3,8}|rgba?\([\d\s.,%]+\))$/i.test(v)?v:'';};
 function walk(from,to){
  Array.prototype.forEach.call(from.childNodes,function(n){
   if(n.nodeType===3){to.appendChild(document.createTextNode(n.nodeValue));return;}
   if(n.nodeType!==1)return;
   var t=n.tagName,el=null;
   if(/^(SCRIPT|STYLE|TEMPLATE|IFRAME|OBJECT|EMBED|NOSCRIPT|TITLE|META|LINK)$/.test(t))return; // ir jų turinio nerodom
   if(t==='BR'){to.appendChild(document.createElement('br'));return;}
   if(t==='B'||t==='STRONG')el=document.createElement('b');
   else if(t==='I'||t==='EM')el=document.createElement('i');
   else if(t==='U')el=document.createElement('u');
   else if(t==='DIV'||t==='P')el=document.createElement('div');
   else if(t==='SPAN'||t==='FONT'){
    el=document.createElement('span');
    var c=okc(n.style&&n.style.color)||(t==='FONT'?okc(n.getAttribute('color')):''),bg=okc(n.style&&n.style.backgroundColor);
    var fw=n.style&&/^(bold|[6-9]00)$/.test(n.style.fontWeight);
    if(c)el.style.color=c;if(bg)el.style.backgroundColor=bg;if(fw)el.style.fontWeight='bold';
    if(!el.getAttribute('style'))el=document.createDocumentFragment();
   }
   else el=document.createDocumentFragment();   // kitos žymos – tik jų turinys
   walk(n,el);to.appendChild(el);
  });
 }
 if(src)walk(src,out);
 return out.innerHTML;
}
// Kaina: „109“ → „109,00 €“; tekstas be valiutos → pridedamas „ €“; su valiuta – nekeičiama
// Kaina visada: €135 (€ priekyje, be tarpo); centai – tik jei ne nuliai: €109,50
function fmtPrice(v){
 var s=String(v||'').trim();if(!s)return '';
 var t=s.replace(/€|\b(eur|euro|eurai|eurų)\b/gi,'').replace(/\s/g,'');
 if(/^\d+([.,]\d{1,2})?$/.test(t)||/^\d{1,3}([.\s]\d{3})+([,]\d{1,2})?$/.test(t)){
  var n=parseFloat(/,\d{1,2}$/.test(t)?t.replace(/\./g,'').replace(',','.'):t.replace(/,/g,''));
  if(!isNaN(n))return '€'+(Math.round(n*100)%100===0?String(Math.round(n)):n.toFixed(2).replace('.',','));
 }
 return s;   // kita valiuta ar tekstas (pvz., „nemokamai“) – paliekam kaip įvesta
}

// ✕ – pašalina spalvas ir paryškinimus elementuose, kurie kertasi su pažymėtu tekstu
function clearDescFormat(ed){
 var s=getSelection();if(!s.rangeCount)return;var r=s.getRangeAt(0);if(!ed.contains(r.startContainer))return;
 var els=Array.prototype.slice.call(ed.querySelectorAll('span,b,strong,i,em,u,font')).filter(function(el){
  return r.collapsed?el.contains(r.startContainer):r.intersectsNode(el);
 });
 // pradžioj vidiniai, kad išardymas nesugadintų išorinių
 els.reverse().forEach(function(el){var p=el.parentNode;if(!p)return;while(el.firstChild)p.insertBefore(el.firstChild,el);p.removeChild(el);});
 ed.normalize();
}

function toMD(html){
 var box=new DOMParser().parseFromString(html||'','text/html').body;
 function walk(node){
  var s='';
  node.childNodes.forEach(function(c){
   if(c.nodeType===3){s+=c.nodeValue.replace(/ /g,' ');return;}
   if(c.nodeType!==1)return;
   var t=c.tagName,inner=walk(c);
   if(t==='B'||t==='STRONG')s+=inner.trim()?'**'+inner.trim()+'**':'';
   else if(t==='I'||t==='EM')s+=inner.trim()?'*'+inner.trim()+'*':'';
   else if(t==='H1'||t==='H2'||t==='H3')s+='\n\n### '+inner.trim()+'\n\n';
   else if(t==='LI')s+='\n- '+inner.trim();
   else if(t==='UL'||t==='OL')s+='\n'+inner+'\n';
   else if(t==='BR')s+='\n';
   else if(t==='IMG')s+='\n[paveiksliukas]\n';
   else if(c.classList&&c.classList.contains('ncard'))s+=cardToMD(cardData(c));
   else if(t==='TABLE'){
    var md='',rows=Array.prototype.slice.call(c.rows);
    rows.forEach(function(r,ri){
     var cells=Array.prototype.map.call(r.cells,function(x){return walk(x).replace(/\n+/g,' ').replace(/\|/g,'\\|').trim();});
     md+='\n| '+cells.join(' | ')+' |';
     if(ri===0)md+='\n|'+cells.map(function(){return ' --- ';}).join('|')+'|';
    });
    s+='\n'+md+'\n\n';
   }
   else if(t==='DIV'||t==='P')s+='\n'+inner;
   else s+=inner;
  });
  return s;
 }

}

   CSS leidžia laužyti tekstą bet kur, o čia kiekvienam stulpeliui nustatome mažiausią plotį
   pagal ilgiausią įprastą žodį – kad žodžiai nebūtų laužomi per vidurį (laužomos tik ilgos nuorodos). */
var fitTimer=null,fitCanvas=null;
function isPhone(){return window.matchMedia('(max-width:760px)').matches;}
// Telefono stulpelio plotis saugomas langelių atribute data-mw (kompiuteryje nenaudojamas)
function setColMobile(t,idx,w){
 Array.prototype.forEach.call(t.rows,function(row){var c=row.cells[idx];if(!c)return;if(w)c.setAttribute('data-mw',w);else c.removeAttribute('data-mw');});
}
function scheduleFit(){clearTimeout(fitTimer);fitTimer=setTimeout(fitTables,250);}
function fitTables(){
 var st=$('fitStyle');
 if(!st){st=document.createElement('style');st.id='fitStyle';document.head.appendChild(st);}
 if(!window.matchMedia('(max-width:760px)').matches){st.textContent='';return;}
 fitCanvas=fitCanvas||document.createElement('canvas');var g=fitCanvas.getContext('2d'),css='';
 editor.querySelectorAll('table').forEach(function(t,ti){
  t.setAttribute('data-ti',ti);
  var mins=[],fixed=[];
  Array.prototype.forEach.call(t.rows,function(r){
   Array.prototype.forEach.call(r.cells,function(c,j){
    var mw=parseInt(c.getAttribute('data-mw'),10);
    if(mw>0){fixed[j]=Math.max(fixed[j]||0,mw);return;}   // naudotojo nustatytas telefono plotis
    var cs=getComputedStyle(c);
    g.font=cs.fontWeight+' '+cs.fontSize+' '+cs.fontFamily;
    var w=0;
    (c.innerText||c.textContent||'').split(/\s+/).forEach(function(word){
     if(word&&word.length<=16)w=Math.max(w,g.measureText(word).width); // ilgesni (nuorodos) – laužomi
     else if(word)w=Math.max(w,96);                                     // bet stulpeliui su nuoroda – bent ~110 px
    });
    w=Math.min(Math.ceil(w)+parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight)+2,150);
    mins[j]=Math.max(mins[j]||0,w);
   });
  });
  // Stulpeliai su nustatytu pločiu – fiksuoti; kiti dalijasi likusią vietą.
  // Jei netelpa – pirmiausia mažinami nefiksuoti (tik tada žodžiai gali lūžti), o jei ir to neužtenka – visi.
  var n=Math.max(mins.length,fixed.length),avail=edW()-2-(n+1),fx=0,fl=0,j; // atimam rėmelius
  for(j=0;j<n;j++){if(fixed[j])fx+=fixed[j];else fl+=(mins[j]||0);}
  if(fx+fl>avail){
   if(fx<avail-30*(n-fixed.filter(Boolean).length)){var k=(avail-fx)/(fl||1);for(j=0;j<n;j++)if(!fixed[j])mins[j]=Math.max(Math.min(30,mins[j]||0),Math.floor((mins[j]||0)*k));}
   else{var k2=avail/(fx+fl);for(j=0;j<n;j++){if(fixed[j])fixed[j]=Math.floor(fixed[j]*k2);else mins[j]=Math.floor((mins[j]||0)*k2);}}
  }
  // galutinė apsauga: jei vis dar per plačiai (dėl 30 px minimumų) – mažinam fiksuotus stulpelius
  var tot=0;for(j=0;j<n;j++)tot+=fixed[j]||mins[j]||0;
  if(tot>avail){var fxs=0;for(j=0;j<n;j++)if(fixed[j])fxs+=fixed[j];
   if(fxs>0){var cut=tot-avail;for(j=0;j<n;j++)if(fixed[j])fixed[j]=Math.max(30,Math.floor(fixed[j]-cut*fixed[j]/fxs));}
   else{var k3=avail/tot;for(j=0;j<n;j++)mins[j]=Math.floor((mins[j]||0)*k3);}}
  for(j=0;j<n;j++){
   var sel='#editor table[data-ti="'+ti+'"] tr>*:nth-child('+(j+1)+')';
   if(fixed[j])css+=sel+'{min-width:'+fixed[j]+'px!important;width:'+fixed[j]+'px!important}\n';
   else css+=sel+'{min-width:'+(mins[j]||0)+'px!important}\n';
  }
 });
 st.textContent=css;
 if(colHT)positionColHandles();
}

function compress(file){
 return new Promise(function(res,rej){
  var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){
   var M=(data&&data.imgMax)||400,w=img.naturalWidth,h=img.naturalHeight,sc=Math.min(1,M/Math.max(w,h));
   w=Math.round(w*sc);h=Math.round(h*sc);
   var c=document.createElement('canvas');c.width=w;c.height=h;
   var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(img,0,0,w,h);
   URL.revokeObjectURL(url);
   // Spalvotas JPEG, kokybė 0.6: geriausias dydžio/vaizdo balansas mišriam turiniui (tekstas + nuotraukos).
   res(c.toDataURL('image/jpeg',0.6));
  };
  img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('Nepavyko nuskaityti paveiksliuko'));};
  img.src=url;
 });
}

// rows – masyvas eilučių su langelių tekstais; header – ar pirma eilutė antraštė
function makeTable(rows,header){
 var h='<table><tbody>';
 rows.forEach(function(r,ri){
  h+='<tr>';
  r.forEach(function(c){var tag=(header&&ri===0)?'th':'td';h+='<'+tag+'>'+(c?esc(c).replace(/\n/g,'<br>'):'<br>')+'</'+tag+'>';});
  h+='</tr>';
 });
 return h+'</tbody></table>';
}
function normRows(rows){var n=0;rows.forEach(function(r){n=Math.max(n,r.length);});return rows.map(function(r){while(r.length<n)r.push('');return r;});}
// Iš įklijuoto HTML paimame tik lentelių tekstą (be stilių, formulių, nuorodų) + aplinkinį tekstą
function tablesFromHTML(html){
 var body=new DOMParser().parseFromString(html,'text/html').body,out='',found=false;
 function cellText(c){return (c.innerText||c.textContent||'').replace(/ /g,' ').replace(/\s*\n\s*/g,'\n').trim();}
 function conv(t){
  var rows=[],header=false;
  Array.prototype.forEach.call(t.rows,function(tr,ri){
   var r=[];
   Array.prototype.forEach.call(tr.cells,function(c){
    r.push(cellText(c));
    var span=Math.min(parseInt(c.getAttribute('colspan'),10)||1,20);for(var k=1;k<span;k++)r.push('');
   });
   if(ri===0&&(tr.parentNode.tagName==='THEAD'||(tr.cells.length&&Array.prototype.every.call(tr.cells,function(c){return c.tagName==='TH';}))))header=true;
   rows.push(r);
  });
  // tuščias eilutes pašalinam
  rows=rows.filter(function(r){return r.some(function(c){return c;});});
  return rows.length?makeTable(normRows(rows),header):'';
 }
 function walk(node){
  Array.prototype.forEach.call(node.childNodes,function(n){
   if(n.nodeType===3){var s=n.nodeValue.trim();if(s)out+='<div>'+esc(s)+'</div>';return;}
   if(n.nodeType!==1||/^(STYLE|SCRIPT|META|LINK|TITLE|COLGROUP)$/.test(n.tagName))return;
   if(n.tagName==='TABLE'){var t=conv(n);if(t){out+=t;found=true;}return;}
   if(n.querySelector('table')){walk(n);return;}
   var s2=(n.innerText||n.textContent||'').trim();if(s2)out+='<div>'+esc(s2).replace(/\n/g,'<br>')+'</div>';
  });
 }
 walk(body);
 return found?out+'<div><br></div>':'';
}
function tableFromTSV(txt){
 var lines=txt.replace(/\r/g,'').replace(/\n+$/,'').split('\n');
 if(lines.length<2)return '';
 var cols=lines[0].split('\t').length;if(cols<2)return '';
 if(!lines.every(function(l){return l.split('\t').length===cols;}))return '';
 return makeTable(lines.map(function(l){return l.split('\t');}),false)+'<div><br></div>';
}

 // Telefone (nėra failo pasirinkimo lango): automatinis atsisiuntimas po pirmo karto dažnai blokuojamas,
 // todėl parodom langą su tikru mygtuku „Atsisiųsti“ (ir „Bendrinti“, jei telefonas leidžia dalintis failu)
 var blob=new Blob([html],{type:'text/html'}),url=URL.createObjectURL(blob),file=null,shareP=null;
 if(!matchMedia('(pointer:coarse)').matches){   // kompiuteryje – kaip anksčiau, iškart atsisiunčia
  var a=document.createElement('a');a.href=url;a.download=fileName();
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(url);a.remove();},2000);
  dirty=false;showSaved();return;
 }
 try{file=new File([blob],fileName(),{type:'text/html'});if(!(navigator.canShare&&navigator.share&&navigator.canShare({files:[file]})))file=null;}catch(_){file=null;}
 var btns=[{l:'Atšaukti',v:null}];
 if(file)btns.push({l:'Bendrinti…',v:'share',c:'',run:function(){shareP=navigator.share({files:[file],title:fileName()});}});
 btns.push({l:'Atsisiųsti',v:'dl',href:url,download:fileName()});
 setStatus('Failas paruoštas');
 var r=await dialog({title:'Išsaugoti failą',text:'Failas „'+fileName()+'“ paruoštas. Paspauskite „Atsisiųsti“'+(file?' arba „Bendrinti…“ (pvz., tiesiai į Dropbox)':'')+'.',buttons:btns});
 setTimeout(function(){URL.revokeObjectURL(url);},60000);
 if(r&&r.btn==='share'){
  try{await shareP;}
  catch(e){data.savedAt=prevSaved;showSaved();return;}
 }
 if(!r){data.savedAt=prevSaved;showSaved();return;}
 dirty=false;showSaved();
}

/* ---------- Dropbox: užšifruoti užrašai laikomi programos aplanke (uzrasai.json) ---------- */
var DBX_PATH='/uzrasai.json',dbxTok=null,dbxExp=0,dbxRev=null;
function dbxCfg(){return lsGet('uzrasai-dbx')||{};}
function dbxOn(){var c=dbxCfg();return !!(c.app&&c.rt);}
function redirectUri(){return location.origin+location.pathname;}
function b64url(buf){return b64(buf).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
async function dbxToken(force){
 if(!force&&dbxTok&&Date.now()<dbxExp-60000)return dbxTok;
 var c=dbxCfg();
 var r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',body:new URLSearchParams({grant_type:'refresh_token',refresh_token:c.rt,client_id:c.app})});
 if(!r.ok){if(r.status===400||r.status===401)throw new Error('Dropbox prisijungimas nebegalioja – prisijunkite iš naujo (⚙ → Dropbox).');throw new Error('Dropbox klaida '+r.status);}
 var j=await r.json();dbxTok=j.access_token;dbxExp=Date.now()+(j.expires_in||14400)*1000;return dbxTok;
}
async function dbxCall(url,opt){
 var r;
 for(var a=0;a<2;a++){
  opt.headers.Authorization='Bearer '+(await dbxToken(a>0));
  r=await fetch(url,opt);
  if(r.status!==401)return r;
 }
 return r;
}
async function dbxDownload(){   // {text,rev} arba null, jei failo dar nėra
 var r=await dbxCall('https://content.dropboxapi.com/2/files/download',{method:'POST',headers:{'Dropbox-API-Arg':JSON.stringify({path:DBX_PATH})}});
 if(r.status===409){var e=await r.text();if(/not_found/.test(e))return null;throw new Error('Dropbox: '+e.slice(0,160));}
 if(!r.ok)throw new Error('Dropbox klaida '+r.status);
 var meta={};try{meta=JSON.parse(r.headers.get('Dropbox-API-Result')||'{}');}catch(_){}
 var text=await r.text();
 if(!meta.rev){
  var m=await dbxCall('https://api.dropboxapi.com/2/files/get_metadata',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:DBX_PATH})});
  if(m.ok)meta=await m.json();
 }
 return {text:text,rev:meta.rev||null};
}
async function dbxUpload(text,overwrite){
 var mode=overwrite?{'.tag':'overwrite'}:(dbxRev?{'.tag':'update',update:dbxRev}:{'.tag':'add'});
 var r=await dbxCall('https://content.dropboxapi.com/2/files/upload',{method:'POST',
  headers:{'Dropbox-API-Arg':JSON.stringify({path:DBX_PATH,mode:mode,autorename:false,mute:true,strict_conflict:true}),'Content-Type':'application/octet-stream'},body:text});
 if(r.status===409){var e=await r.text();if(/conflict/.test(e)){var x=new Error('conflict');x.conflict=true;throw x;}throw new Error('Dropbox: '+e.slice(0,160));}
 if(!r.ok)throw new Error('Dropbox klaida '+r.status);
 var j=await r.json();dbxRev=j.rev;return j;
}
// Laukiam prisijungimo kodo, kurį grįžęs Dropbox langas įrašo į localStorage
function dbxWaitCode(state){
 return new Promise(function(res,rej){
  var t0=Date.now(),iv=setInterval(chk,800);
  function chk(){
   var c=lsGet('uzrasai-dbx-code');
   if(c&&c.state===state){clearInterval(iv);window.removeEventListener('storage',chk);lsSet('uzrasai-dbx-code',null);if(c.code)res(c.code);else rej(new Error(c.error||'Prisijungimas atšauktas.'));}
   else if(Date.now()-t0>600000){clearInterval(iv);window.removeEventListener('storage',chk);rej(new Error('Per ilgai laukta prisijungimo.'));}
  }
  window.addEventListener('storage',chk);
 });
}
async function dbxSaveNow(overwrite){
 if(cur){cur.html=editorHTML();cur.title=titleIn.value;}
 setStatus('Saugoma į Dropbox…');
 var prev=data.savedAt;data.savedAt=Date.now();
 try{await dbxUpload(await makeBlob(),overwrite);dirty=false;showSaved();return true;}
 catch(e){data.savedAt=prev;showSaved();throw e;}
}
async function save(){
 if(!key)return;
 if(!dbxOn())return saveFile();
 try{await dbxSaveNow(false);}
 catch(e){
  if(e.conflict){
   var r=await dialog({title:'Dropbox yra naujesnė versija',text:'Užrašai Dropbox buvo pakeisti kitame įrenginyje po to, kai juos čia atidarėte.\n\nPerrašyti – įrašyti šiuos (kito įrenginio pakeitimai liks tik Dropbox versijų istorijoje).\nAtidaryti naujesnę – iš naujo atrakinti (čia padaryti pakeitimai dings).',
    buttons:[{l:'Atidaryti naujesnę',v:'reload',row:1},{l:'Perrašyti',v:'over',c:'danger',row:1},{l:'Atšaukti',v:null,row:2}]});
   if(r&&r.btn==='over'){try{await dbxSaveNow(true);}catch(e2){notify('Nepavyko išsaugoti',e2.message||String(e2));}}
   else if(r&&r.btn==='reload'){dirty=false;location.reload();}
  }else{
   var r2=await dialog({title:'Nepavyko išsaugoti į Dropbox',text:(e.message||String(e))+'\n\nGalite išsaugoti atsarginę kopiją failu.',buttons:[{l:'Atšaukti',v:null},{l:'Išsaugoti failu',v:'file',c:'primary'}]});
   if(r2&&r2.btn==='file')saveFile();
  }
 }
}
async function dbxSetup(){
 closeDrawer();
 if(dbxOn()){
  var r=await dialog({title:'Dropbox',text:'Prijungta. „Išsaugoti“ įrašo užšifruotus užrašus į Dropbox: Programos (Apps) → jūsų programos aplankas → uzrasai.json.\n\nAtjungus užrašai Dropbox lieka, tik šis įrenginys nebeįrašys į juos.',
   buttons:[{l:'Atjungti',v:'off',c:'danger left'},{l:'Gerai',v:'ok',c:'primary'}]});
  if(r&&r.btn==='off'){
   try{await dbxCall('https://api.dropboxapi.com/2/auth/token/revoke',{method:'POST',headers:{}});}catch(_){}
   lsSet('uzrasai-dbx',null);dbxTok=null;dbxRev=null;notify('Dropbox atjungtas','„Išsaugoti“ vėl išsaugo failą.');
  }
  return;
 }
 if(location.protocol!=='https:'&&location.hostname!=='localhost'){
  await notify('Reikia https adreso','Dropbox leidžia prisijungti tik iš puslapio, atidaryto per https:// adresą (pvz., GitHub Pages). Iš failo kompiuteryje prisijungti negalima.');return;
 }
 var ver=b64url(crypto.getRandomValues(new Uint8Array(48))),state=b64url(crypto.getRandomValues(new Uint8Array(16)));
 var ch=b64url(await crypto.subtle.digest('SHA-256',enc.encode(ver))),win=null,app='';
 var r=await dialog({title:'Prijungti Dropbox',
  text:'Įveskite Dropbox programos „App key“.\n\nDropbox programos nustatymuose (Settings → OAuth 2 → Redirect URIs) turi būti įrašytas šis adresas:\n'+redirectUri(),
  input:(dbxCfg().app||(lsGet('uzrasai-dbx-pkce')||{}).app||''),
  buttons:[{l:'Atšaukti',v:null},{l:'Prisijungti',v:'ok',c:'primary',run:function(){
   app=$('dlgIn').value.trim();if(!app)return;
   lsSet('uzrasai-dbx-pkce',{app:app,ver:ver,state:state});lsSet('uzrasai-dbx-code',null);
   win=window.open('https://www.dropbox.com/oauth2/authorize?'+new URLSearchParams({client_id:app,response_type:'code',code_challenge:ch,code_challenge_method:'S256',token_access_type:'offline',redirect_uri:redirectUri(),state:state}),'_blank');
  }}]});
 if(!r||!app)return;
 if(!win){await notify('Langas užblokuotas','Naršyklė neleido atidaryti Dropbox prisijungimo lango. Leiskite iššokančius langus šiam puslapiui ir bandykite dar kartą.');return;}
 setStatus('Laukiama Dropbox prisijungimo…');
 try{
  var code=await dbxWaitCode(state);
  var t=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',body:new URLSearchParams({code:code,grant_type:'authorization_code',code_verifier:ver,client_id:app,redirect_uri:redirectUri()})});
  if(!t.ok)throw new Error('Prisijungimas nepavyko: '+(await t.text()).slice(0,160));
  var j=await t.json();
  lsSet('uzrasai-dbx',{app:app,rt:j.refresh_token});lsSet('uzrasai-dbx-pkce',null);
  dbxTok=j.access_token;dbxExp=Date.now()+(j.expires_in||14400)*1000;
  if(!key){boot();return;}   // prijungta iš užrakto lango – tiesiog įkeliam Dropbox užrašus
  var ex=await dbxDownload();
  if(!ex){dbxRev=null;await dbxSaveNow(false);notify('Dropbox prijungtas','Užrašai įrašyti į Dropbox. Toliau „Išsaugoti“ įrašys tiesiai ten.');return;}
  dbxRev=ex.rev;showSaved();
  var r3=await dialog({title:'Dropbox jau yra užrašų',text:'Dropbox jau yra išsaugotų užrašų. Ką daryti?\n\nAtidaryti – iš naujo atrakinti Dropbox užrašus (čia neišsaugoti pakeitimai dings).\nPerrašyti – įrašyti dabartinius užrašus vietoje esančių Dropbox.',
   buttons:[{l:'Atidaryti Dropbox užrašus',v:'open',c:'primary',row:1},{l:'Perrašyti',v:'over',c:'danger',row:1},{l:'Vėliau',v:null,row:2}]});
  if(r3&&r3.btn==='open'){dirty=false;location.reload();}
  else if(r3&&r3.btn==='over')await dbxSaveNow(true);
 }catch(e){showSaved();notify('Dropbox',e.message||String(e));}
}
async function devKeySetup(){
 closeDrawer();
 if(devKid){await showDevKey(false);return;}
 var r=await dialog({title:'Įrenginio raktas',text:'Įjungus, užrašai bus šifruojami slaptažodžiu kartu su atsitiktiniu įrenginio raktu, kuris laikomas tik jūsų įrenginiuose. Net gavus failą ir atspėjus slaptažodį, be šio rakto užrašų atidaryti nepavyks.\n\nĮjungimui įveskite dabartinį slaptažodį.',
  input:'',inputType:'password',buttons:[{l:'Atšaukti',v:null},{l:'Įjungti',v:'ok',c:'primary'}]});
 if(!r)return;
 // patikrinam slaptažodį: dabartiniu raktu užšifruotą bandinį turi iššifruoti iš slaptažodžio gautas raktas
 var iv=crypto.getRandomValues(new Uint8Array(12)),probe=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,enc.encode('ok'));
 try{var k0=await deriveKey(r.value,salt,keyIter,devKey);await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},k0,probe);}
 catch(_){await notify('Neteisingas slaptažodis','Įrenginio raktas neįjungtas.');return;}
 var dk=crypto.getRandomValues(new Uint8Array(20)),kid=await dkId(dk),s2=crypto.getRandomValues(new Uint8Array(16));
 key=await deriveKey(r.value,s2,ITER,dk);salt=s2;keyIter=ITER;devKey=dk;devKid=kid;dkStore(kid,dk);
 setDirty(true);
 await showDevKey(true);
 setStatus('Įrenginio raktas įjungtas – išsaugokite',true);
}
$('dbxBtn').onclick=dbxSetup;

/* ---------- Kita ---------- */
function closeDrawer(){document.body.classList.remove('drawer');}
$('menuBtn').onclick=function(){if(!isWide()&&document.body.classList.contains('noteView')){showList();return;}document.body.classList.toggle('drawer');};

 if(!dirty){location.reload();return;}

 });
};

/* Naršyklės „Išsaugoti slaptažodį?“ pasiūlymas: kompiuteryje slaptažodžio laukai paverčiami paprastais teksto laukais,
   rodomais taškais (CSS), todėl slaptažodžių tvarkyklė jų neatpažįsta. Telefone paliekam tikrus slaptažodžio laukus –
   kitaip klaviatūra (pvz., Gboard) galėtų įsiminti slaptažodį kaip žodį ir jį siūlyti. */
$('verLock').textContent='Versija '+VERSION;$('verSide').textContent='Versija '+VERSION;

// Grįžimas iš Dropbox prisijungimo (atskirame lange): kodą perduodam pradiniam langui per localStorage
var qs=new URLSearchParams(location.search),AUTH_RETURN=!!(qs.get('state')&&(qs.get('code')||qs.get('error')));
async function boot(){
 $('lockRetry').classList.add('hidden');$('lockNoDbx').classList.add('hidden');
 $('lockDbx').classList.toggle('hidden',dbxOn()||location.protocol!=='https:');
 if(dbxOn()){
  setLockMode('unlock');lockBtn.disabled=true;$('lockHint').textContent='Įkeliama iš Dropbox…';
  try{
   var x=await dbxDownload();
   if(x){raw=x.text.trim();dbxRev=x.rev;}
   lockBtn.disabled=false;setLockMode(raw?'unlock':'create');
   $('lockHint').textContent=raw?'Įveskite slaptažodį. Užrašai įkelti iš Dropbox.':'Dropbox užrašų dar nėra. Sugalvokite slaptažodį.';
  }catch(e){
   lockErr.textContent='Nepavyko įkelti iš Dropbox: '+(e.message||e);
   $('lockRetry').classList.remove('hidden');$('lockNoDbx').classList.remove('hidden');
  }
 }else setLockMode(raw?'unlock':'create');
}
$('lockDbx').onclick=function(){dbxSetup();};
$('lockRetry').onclick=function(){lockErr.textContent='';boot();};
$('lockNoDbx').onclick=function(){lsSet('uzrasai-dbx',null);location.reload();};
if(AUTH_RETURN){
 lsSet('uzrasai-dbx-code',{state:qs.get('state'),code:qs.get('code'),error:qs.get('error_description')||qs.get('error')});
 history.replaceState(null,'',location.pathname);
 $('lockForm').innerHTML='<h1>Dropbox</h1><p>'+(qs.get('code')?'Prisijungta. Šį langą galite uždaryti ir grįžti į užrašus.':'Prisijungimas atšauktas. Šį langą galite uždaryti.')+'</p>';
 setTimeout(function(){try{window.close();}catch(_){}},800);
}else if(!window.crypto||!crypto.subtle){
 setLockMode(raw?'unlock':'create');
 $('lockHint').textContent='Ši naršyklė čia neleidžia šifruoti. Atidarykite failą per kitą naršyklę (pvz. Chrome, Firefox) arba per https adresą.';
 lockBtn.disabled=true;
}else boot();

/* Ar šis failas jau atidarytas kitame tos pačios naršyklės lange?
   Langai susikalba per BroadcastChannel (kanalo vardas – failo adresas). Kitų failų ir kitų naršyklių nemato. */
(function(){
 if(!window.BroadcastChannel||AUTH_RETURN)return;
 var me=Math.random().toString(36).slice(2),bc;
 try{bc=new BroadcastChannel('uzrasai:'+location.href.split('#')[0]);}catch(_){return;}
 var warned=false;
 bc.onmessage=function(e){
  var m=e.data||{};if(m.from===me)return;
  if(m.t==='ping'){
   bc.postMessage({t:'here',from:me,unlocked:!!key,dirty:!!dirty});
   // senesniame lange – trumpas priminimas
   setStatus('Šis failas atidarytas dar viename lange',true);setTimeout(function(){showSaved();},6000);
  }
  else if(m.t==='here'&&!warned){
   warned=true;
   dialog({title:'Failas jau atidarytas',
    text:'„'+fileName()+'“ jau atidarytas kitame šios naršyklės lange'+(m.unlocked?' (atrakintas'+(m.dirty?', su neišsaugotais pakeitimais':'')+')':'')+'.\n\n'+
     'Jei redaguosite abiejuose languose, paskutinis išsaugojimas perrašys kito lango pakeitimus. Geriau dirbkite viename lange – šį uždarykite.',
    buttons:[{l:'Vis tiek tęsti',v:'ok',c:'primary'}]});
  }
 };
 bc.postMessage({t:'ping',from:me});
})();
})();
